name: Generate upload keystore (run ONCE)

# For when you have no computer with Java installed. It creates a brand-new upload
# keystore with random passwords and hands it to you as a private artifact that
# auto-deletes after 1 day.
#
# SAFETY: only do this in a PRIVATE repository - anyone who can read a repo can
# download its artifacts. Then: download it, copy the 4 values into repository
# secrets, back the .jks up somewhere safe (password manager / cloud drive), and
# delete the artifact. Do NOT run this again later: a new keystore is a different
# key, and Play will reject uploads signed with it.
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: true
        default: 'quickqr-upload'
      your_name:
        description: 'Your name or company (goes in the certificate)'
        required: true
        default: 'QuickQR'
      country_code:
        description: 'Two-letter country code (e.g. US, IN, GB)'
        required: true
        default: 'US'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEY_ALIAS: ${{ inputs.key_alias }}
          YOUR_NAME: ${{ inputs.your_name }}
          COUNTRY: ${{ inputs.country_code }}
        run: |
          set -euo pipefail
          # keytool's distinguished-name format uses commas, so strip them from input.
          NAME_CLEAN="$(printf '%s' "$YOUR_NAME" | tr -d ',=\\"')"
          COUNTRY_CLEAN="$(printf '%s' "$COUNTRY" | tr -cd 'A-Za-z' | cut -c1-2 | tr 'a-z' 'A-Z')"
          ALIAS_CLEAN="$(printf '%s' "$KEY_ALIAS" | tr -cd 'A-Za-z0-9_-')"

          PASSWORD="$(openssl rand -hex 20)"
          echo "::add-mask::$PASSWORD"

          mkdir -p out
          # Validity 10000 days (~27 years): Play requires the key to be valid past Oct 2033.
          # PKCS12 keystores use one password for both store and key.
          keytool -genkeypair -keystore out/upload-keystore.jks -storetype PKCS12 \
            -alias "$ALIAS_CLEAN" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=$NAME_CLEAN, O=$NAME_CLEAN, C=$COUNTRY_CLEAN"

          {
            echo "Add these as repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "KEYSTORE_PASSWORD = $PASSWORD"
            echo "KEY_PASSWORD      = $PASSWORD"
            echo "KEY_ALIAS         = $ALIAS_CLEAN"
            echo
            echo "KEYSTORE_BASE64   = (the single long line in keystore-base64.txt)"
          } > out/secrets.txt
          base64 -w0 out/upload-keystore.jks > out/keystore-base64.txt

      - name: Upload private artifact (deleted after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-PRIVATE
          path: out/*
          retention-days: 1
          if-no-files-found: error
