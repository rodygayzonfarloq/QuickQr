name: Release (signed AAB for Google Play)

# Builds a SIGNED Android App Bundle (.aab) for the Play Store, plus a signed .apk
# you can install on a phone to smoke-test the exact release build (R8-shrunk).
#
#  * Push a tag like  v1.0.0  -> builds, and attaches the files to a GitHub Release.
#  * Or run it by hand from the Actions tab (optionally uploading straight to Play).
#
# One-time setup (secrets): see docs/PLAY_STORE_RELEASE.md
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.0.0). Ignored on tag pushes - the tag is used.'
        required: true
        default: '1.0.0'
      publish_to_play:
        description: 'Upload the AAB to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON secret)'
        type: boolean
        default: false
      play_track:
        description: 'Play track to publish to'
        type: choice
        options: [ internal, alpha, beta, production ]
        default: internal
      release_status:
        description: 'draft = review & roll out yourself in Play Console (required while the app is still a draft)'
        type: choice
        options: [ draft, completed ]
        default: draft

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to create the GitHub Release on tag pushes
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # Must equal applicationId in app/build.gradle (change both together).
      PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME || 'com.quickqr.app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets are configured
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ "$HAS_KEYSTORE" = "true" ]      || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ]       || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]               || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]            || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            echo "See docs/PLAY_STORE_RELEASE.md, section 'Create your upload keystore'."
            exit 1
          fi

      - name: Work out version name and code
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
          fi
          # Play rejects an upload whose versionCode was already used, so it must only ever
          # go up. The workflow run number does exactly that.
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm keystore opens and show its fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Fails early with a clear message if the password/alias is wrong.
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name|Valid from|SHA1|SHA256' \
            || { echo "::error::Could not read the keystore - check KEYSTORE_PASSWORD and KEY_ALIAS"; exit 1; }

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon

      - name: Verify the bundle is signed
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt || { echo "::error::AAB is not signed"; exit 1; }

      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/QuickQR-${VERSION_NAME}-${VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk    "dist/QuickQR-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp app/build/outputs/mapping/release/mapping.txt    "dist/mapping-${VERSION_NAME}-${VERSION_CODE}.txt"
          ls -lh dist

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: QuickQR-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.aab
            dist/*.apk
          generate_release_notes: true

      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: dist/*.aab
          mappingFile: dist/mapping-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}.txt
          track: ${{ inputs.play_track }}
          status: ${{ inputs.release_status }}

      - name: Explain why Play upload was skipped
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play && env.HAS_PLAY != 'true'
        run: echo "::warning::publish_to_play was ticked but the PLAY_SERVICE_ACCOUNT_JSON secret is not set, so nothing was uploaded. Download the .aab artifact and upload it in Play Console instead."
