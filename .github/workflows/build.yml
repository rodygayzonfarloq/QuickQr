name: Build APK + AAB

# Runs on every push to main (and by hand from the Actions tab).
#  * Always builds a debug APK for quick phone testing.
#  * Also builds a SIGNED release AAB for Google Play, as long as the signing
#    secrets are set (see docs/PLAY_STORE_RELEASE.md). Without them the AAB step
#    is skipped and the debug APK still builds.
# For versioned releases (tags, GitHub Release, optional Play upload) use release.yml.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets aren't available to pull requests from forks, and we don't sign PR builds.
      CAN_SIGN: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar isn't committed (it's a binary), so we install the
      # exact Gradle version the project expects and call `gradle`, not `./gradlew`.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickQR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode keystore and set version
        if: env.CAN_SIGN == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # Play rejects a versionCode it has already seen, so it must only go up.
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: env.CAN_SIGN == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Verify the bundle is signed
        if: env.CAN_SIGN == 'true'
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt || { echo "::error::AAB is not signed"; exit 1; }

      - name: Upload signed AAB + mapping
        if: env.CAN_SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QuickQR-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Note if AAB was skipped
        if: env.CAN_SIGN != 'true'
        run: echo "::notice title=AAB skipped::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to also get a signed AAB (see docs/PLAY_STORE_RELEASE.md). Not built for pull requests."
