plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// ---------------------------------------------------------------------------
// Release signing
// Values come from environment variables (GitHub Actions) or, for local builds,
// from a git-ignored keystore.properties file in the project root. See
// keystore.properties.example and docs/PLAY_STORE_RELEASE.md.
// ---------------------------------------------------------------------------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keystoreProps.getProperty(propName)
}
def releaseStoreFilePath = signingValue('KEYSTORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias      = signingValue('KEY_ALIAS', 'keyAlias')
def releaseKeyPassword   = signingValue('KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias &&
        releaseKeyPassword && rootProject.file(releaseStoreFilePath).exists()

// CI sets VERSION_CODE (must increase with every Play upload) and VERSION_NAME.
def appVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
def appVersionName = System.getenv('VERSION_NAME') ?: '1.0'

android {
    namespace 'com.quickqr.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.quickqr.app"
        minSdk 29
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinking + resource shrinking keep the Play download small.
            // Test the signed release APK (built by the Release workflow) on a real
            // device before uploading - shrinking is the usual source of "works in
            // debug, crashes in release" bugs. Rules live in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // Play serves per-device splits from the AAB; these are the defaults, spelled out.
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Core / UI
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // CameraX - live camera preview + frame analysis
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    // ML Kit Barcode Scanning (Play Services / dynamically-downloaded model)
    // Detects QR codes plus common 1D/2D barcode formats.
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

    // ZXing - used only for QR code *generation* (ML Kit only reads codes, it doesn't create them)
    implementation 'com.google.zxing:core:3.5.4'

    // Room - local scan history database. (room-ktx is intentionally NOT listed: as of
    // Room 2.6+ its APIs were folded into room-runtime and the ktx artifact is now empty.)
    implementation 'androidx.room:room-runtime:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
